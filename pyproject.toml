[project]
name = "agent-plugin-forge"
version = "0.3.0"
description = "Review and publish Agent Skills and MCP servers as validated Agent Plugins 1.0 distributions."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "MiguelElGallo" }]
dependencies = [
  "jsonschema>=4.26,<5",
  "license-expression>=30.4.4,<31",
  "pydantic>=2.13.5,<3",
  "pyyaml>=6.0.3,<7",
  "semantic-version>=2.10,<3",
  "typer>=0.27.2,<0.28",
]

[project.scripts]
forge = "agent_plugin_forge.cli:main"

[dependency-groups]
dev = [
  "pytest>=9.1.1,<10",
  "pytest-cov>=7.1,<8",
  "ruff>=0.16.7,<0.17",
  "ty>=0.0.80,<0.1",
  "zensical>=0.0.61,<0.1",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --cov=agent_plugin_forge --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]

[tool.coverage.run]
patch = ["subprocess"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
    "RUF",
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D106",
    "D107",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D101", "D102", "D103", "D104", "D105", "D106", "D107"]

[tool.ty.src]
include = ["src", "tests", "benchmarks"]
