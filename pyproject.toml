[project]
name = "agent-plugin-forge"
version = "0.3.0"
description = "Review and publish Agent Skills and MCP servers as validated Agent Plugins 1.0 distributions."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "MiguelElGallo" }]
dependencies = [
  "jsonschema>=4.25,<5",
  "license-expression>=30.4,<31",
  "pydantic>=2.12,<3",
  "pyyaml>=6.0.2,<7",
  "semantic-version>=2.10,<3",
]

[project.scripts]
forge = "agent_plugin_forge.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<0.13",
  "ty>=0.0.1a17,<0.0.2",
  "zensical>=0.0.11,<0.1",
]

[build-system]
requires = ["uv_build>=0.8.13,<0.9"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --cov=agent_plugin_forge --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "D100"]

[tool.ty.src]
include = ["src", "tests"]
