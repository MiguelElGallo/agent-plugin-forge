[project]
site_name = "Agent Plugin Forge"
site_description = "Install the Forge, publish reviewed Agent Skills, and install portable Agent Plugins 1.0."
site_author = "MiguelElGallo"
site_url = "https://miguelelgallo.github.io/agent-plugin-forge/"
repo_url = "https://github.com/MiguelElGallo/agent-plugin-forge"
repo_name = "MiguelElGallo/agent-plugin-forge"
copyright = "Copyright &copy; 2026 MiguelElGallo"

nav = [
  { "Start" = "index.md" },
  { "Tutorials" = [
    { "Install the Forge" = "tutorials/install-forge.md" },
    { "Install a published plugin" = "tutorials/install-published-plugin.md" },
    { "Forge contributor tutorial" = [
      { "Prepare a development checkout" = "tutorials/prepare-vscode.md" },
      { "Import your first skill" = "tutorials/first-skill.md" },
      { "Generate and test" = "tutorials/review-generate.md" },
      { "Load a local package in VS Code" = "tutorials/use-in-vscode.md" },
      { "Add an MCP server" = "tutorials/add-mcp.md" },
    ] },
  ] },
  { "How-to" = [
    { "Publish a skill with your agent" = "how-to/publish-skill.md" },
    { "Use a private marketplace" = "how-to/private-marketplace.md" },
    { "Maintain a team marketplace" = "how-to/maintain-team-marketplace.md" },
    { "Benchmark the skill workflow" = "how-to/benchmark-skill.md" },
    { "Troubleshoot installation and imports" = "how-to/troubleshoot.md" },
    { "Import an existing skill" = "how-to/import-skill.md" },
    { "Create a skill" = "how-to/create-skill.md" },
    { "Add to a bundle" = "how-to/bundle-skill.md" },
    { "Add MCP" = "how-to/add-mcp.md" },
    { "Open and merge a PR" = "how-to/pull-request.md" },
    { "Validate and release" = "how-to/validate-release.md" },
  ] },
  { "Reference" = [
    { "Client installation" = "reference/client-installation.md" },
    { "Client compatibility evidence" = "reference/compatibility.md" },
    { "Standards and Forge policy" = "reference/standards.md" },
    { "CLI" = "reference/cli.md" },
    { "Repository layout" = "reference/layout.md" },
    { "Metadata and provenance" = "reference/metadata.md" },
  ] },
  { "Explanation" = [
    { "Review and publication" = "explanation/review-and-publish.md" },
    { "Architecture" = "explanation/architecture.md" },
    { "Trust model" = "explanation/trust-model.md" },
  ] },
]

[project.theme]
language = "en"
variant = "classic"
features = [
  "content.action.edit",
  "content.action.view",
  "content.code.copy",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "search.highlight",
]

[project.theme.icon]
logo = "lucide/anvil"
repo = "fontawesome/brands/github"

[[project.theme.palette]]
scheme = "default"
primary = "deep-purple"
accent = "amber"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
primary = "deep-purple"
accent = "amber"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"
